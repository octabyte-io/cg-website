name: Deploy to GitHub Pages

# Manual only until GitHub Pages is turned on for this repository (Settings > Pages > Source:
# GitHub Actions). Then add `push: { branches: [main] }` under `on:` to deploy every merge.
on:
  workflow_dispatch:
  # /install.sh is the cloudgate repository's install.sh, copied at build time
  # (src/pages/install.sh.ts). Rebuild when that repository says the script changed
  # (a repository_dispatch of this type), and daily as a safety net. Both take effect once
  # Pages is turned on.
  repository_dispatch:
    types: [install-script-updated]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
