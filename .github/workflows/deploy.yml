name: Deploy to GitHub Pages

# Deploys every push to main, by hand, and when cloudgate's install.sh changes. Needs
# Settings > Pages > Source: GitHub Actions, with the custom domain cloudgate.octabyte.io.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # /install.sh is the cloudgate repository's install.sh, copied at build time
  # (src/pages/install.sh.ts). The cloudgate repository's notify-website workflow sends this
  # event when install.sh changes on main, so the copy here is rebuilt within minutes.
  repository_dispatch:
    types: [install-script-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
